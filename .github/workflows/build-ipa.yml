name: Build IPA

# Builds an iOS .ipa on every merge to master.
#
# Default output is an UNSIGNED ipa (sideload with AltStore / Sideloadly, which
# re-sign it with your Apple ID). If the signing secrets below are present the
# ipa is signed in CI instead and can be installed directly.
#
# Optional secrets for a signed build:
#   IOS_CERTIFICATE_P12_BASE64      base64 of the signing certificate (.p12)
#   IOS_CERTIFICATE_PASSWORD        password of that .p12
#   IOS_PROVISIONING_PROFILE_BASE64 base64 of the .mobileprovision for the bundle id

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  ipa:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          pod --version

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Resolve workspace and scheme
        id: xc
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 200

      - name: Package ipa
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          echo "APP_IN_PAYLOAD=$RUNNER_TEMP/ipa/Payload/$(basename "$APP")" >> "$GITHUB_ENV"

      - name: Sign (only when signing secrets exist)
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | awk '{print $2}')

          # Entitlements come from the provisioning profile, so the signed app
          # gets exactly what the profile grants (hotspot configuration etc.).
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"

          cp "$RUNNER_TEMP/app.mobileprovision" "$APP_IN_PAYLOAD/embedded.mobileprovision"

          if [ -d "$APP_IN_PAYLOAD/Frameworks" ]; then
            find "$APP_IN_PAYLOAD/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 |
              xargs -0 -n1 codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN"
          fi
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" \
            --entitlements "$RUNNER_TEMP/entitlements.plist" "$APP_IN_PAYLOAD"
          codesign --verify --deep --strict "$APP_IN_PAYLOAD"
          echo "IPA_SUFFIX=signed" >> "$GITHUB_ENV"

      - name: Zip ipa
        run: |
          SUFFIX="${IPA_SUFFIX:-unsigned}"
          IPA="$RUNNER_TEMP/MotoLink-${{ github.run_number }}-$SUFFIX.ipa"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$IPA" Payload)
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ env.IPA }}
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "$IPA" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automatic build of ${{ github.sha }}." \
            --target "${{ github.sha }}"

      - name: Remove signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
